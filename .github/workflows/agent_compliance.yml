name: agent-compliance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  protected-files:
    name: File protetti
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifica che il branch feature non tocchi i file globali
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'integration') }}
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          bash check_compliance.sh "origin/${{ github.base_ref }}"

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  backend:
    name: Backend (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Smoke test dell'app
        run: uv run python -c "from app.main import app; print(len(app.routes), 'routes')"
